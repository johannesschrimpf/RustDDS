on:
  push:
    branches: [master]
  pull_request:

name: CI / Tests on macOS

permissions: read-all

jobs:

  test-on-macos:
    # Since macOS 15, a process needs "Local Network Permission" to send
    # multicast, and a GitHub runner cannot grant it: as the runner user,
    # sending fails with "No route to host". Run as root, the tests pass.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test -- --test-threads=1
